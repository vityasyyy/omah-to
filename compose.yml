services:
  # LOKI SERVICE
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - ./loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - omahtryout-network

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yaml:/etc/promtail/promtail.yaml
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - omahtryout-network
    depends_on:
      - loki

  # prometheus
  prometheus:
    image: prom/prometheus:v2.43.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus:/prometheus
    networks:
      - omahtryout-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - "3000:3000" # Access Grafana at localhost:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_AUTH_ANONYMOUS_ORG_ID=1
    networks:
      - omahtryout-network
    volumes:
      - grafana-storage:/var/lib/grafana

  # --- NEW: Redis Service ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - omahtryout-network

  # --- NEW: Zookeeper (for Kafka) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - omahtryout-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # --- NEW: Kafka Service ---
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    networks:
      - omahtryout-network
    depends_on:
      - zookeeper
    ports:
      - "29092:29092" # Port for your host machine to access Kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # auth service
  auth-service-db:
    image: postgres:17.2-alpine
    env_file:
      - ./auth-service/.env
      - .env # Use the root .env file
    volumes:
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - auth-data:/var/lib/postgresql/data
    networks:
      - omahtryout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omahTryOut -d auth_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service-api:
    build: ./auth-service
    env_file:
      - ./auth-service/.env
      - .env # Use the root .env file
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}" # Expose to host
    depends_on:
      auth-service-db:
        condition: service_healthy
    volumes:
      - ./auth-service/keys:/home/appuser/keys:ro
      - ./auth-service/var/log/auth-service:/var/log/auth-service
    networks:
      - omahtryout-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider --quiet http://localhost:${AUTH_SERVICE_PORT}/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Soal service
  soal-service-db:
    image: postgres:17.2-alpine
    env_file:
      - .env # Use the root .env file
      - ./soal-service/.env
    volumes:
      - ./soal-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./soal-service/db/soal.sql:/docker-entrypoint-initdb.d/soal.sql # Load soal data
      - ./soal-service/db/minatbakat.sql:/docker-entrypoint-initdb.d/minatbakat.sql # Load mb data
      - soal-data:/var/lib/postgresql/data
    networks:
      - omahtryout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omahTryOut -d soal_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  soal-service-api:
    build: ./soal-service
    env_file:
      - ./soal-service/.env
      - .env # Use the root .env file
    ports:
      - "${SOAL_SERVICE_PORT}:${SOAL_SERVICE_PORT}" # Expose HTTP port
      - "50051:50051" # Expose gRPC port
    depends_on:
      soal-service-db:
        condition: service_healthy
      auth-service-api:
        condition: service_healthy
    networks:
      - omahtryout-network
    volumes:
      - ./soal-service/var/log/soal-service:/var/log/soal-service

  # Tryout service
  tryout-service-db:
    image: postgres:17.2-alpine
    env_file:
      - ./tryout-service/.env
      - .env # Use the root .env file
    volumes:
      - ./tryout-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - tryout-data:/var/lib/postgresql/data
    networks:
      - omahtryout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omahTryOut -d tryout_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  tryout-service-api:
    build: ./tryout-service
    env_file:
      - .env # Use the root .env file
      - ./tryout-service/.env
    ports:
      - "${TRYOUT_SERVICE_PORT}:${TRYOUT_SERVICE_PORT}" # Expose to host
    depends_on:
      tryout-service-db:
        condition: service_healthy
      auth-service-api:
        condition: service_healthy
      soal-service-api:
        condition: service_started # gRPC doesn't have a simple healthcheck
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - omahtryout-network
    volumes:
      - ./tryout-service/var/log/tryout-service:/var/log/tryout-service

  # Minat bakat service
  minat-bakat-service-db:
    image: postgres:17.2-alpine
    env_file:
      - ./minat-bakat-service/.env
      - .env # Use the root .env file
    volumes:
      - ./minat-bakat-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - minat-bakat-data:/var/lib/postgresql/data
    networks:
      - omahtryout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omahTryOut -d minat_bakat_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minat-bakat-service-api:
    build: ./minat-bakat-service
    env_file:
      - .env # Use the root .env file
      - ./minat-bakat-service/.env
    ports:
      - "${MINAT_BAKAT_SERVICE_PORT}:${MINAT_BAKAT_SERVICE_PORT}" # Expose to host
    depends_on:
      minat-bakat-service-db:
        condition: service_healthy
      auth-service-api:
        condition: service_healthy
    networks:
      - omahtryout-network
    volumes:
      - ./minat-bakat-service/var/log/minat-bakat-service:/var/log/minat-bakat-service

networks:
  omahtryout-network:
    driver: bridge # Use the default bridge network

# volumes for persistent data
volumes:
  auth-data:
  soal-data:
  tryout-data:
  minat-bakat-data:
  grafana-storage:
  loki-data:
  prometheus-data:
